<body>
    <fieldset>
        <form action="https://webhook.cool/at/cool-lake-34" method="post">
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="pokemon_name" required>
            </p>
            <p>
                <label for="type">Type:</label>
                <input type="text" id="type" name="pokemon_type">
            </p>
            <p>
                <label for="points">Attack Points:</label>

                <button type="submit">Submit Your Creature</button>
            </p>
        </form>
    </fieldset>
